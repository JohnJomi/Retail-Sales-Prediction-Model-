[project]
name = "retail-sales"
version = "0.1.0"
description = "Predict retail transaction amounts with a Random Forest pipeline"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
